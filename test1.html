<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch Card</title>
    <style>
body {
    font-family: Arial, sans-serif;
  display: flex;
flex-direction: column;
    align-items: center;
background-color: #f4f4f9;
    margin: 0;
padding: 20px;
    overflow-x: hidden;
}
h1 {
  color: #333;
}
#stats-container {
  display: flex;
  gap: 20px;
  margin-bottom: 15px;
  font-size: 1.1rem;
  font-weight: bold;
  color: #555;
}
    .card-container {
position: relative;
width: 320px;
      height: 320px;
border-radius: 12px;
      overflow: hidden;
box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
  user-select: none;
    }
.grid {
    display: grid;
  grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
width: 100%;
    height: 100%;
background-color: #ffffff;
}
    .grid-cell {
display: flex;
    justify-content: center;
align-items: center;
    font-size: 2.2rem;
border: 1px dashed #e0e0e0;
    box-sizing: border-box;
    transition: transform 0.3s ease, background-color 0.3s ease;
}
.grid-cell.winning {
  background-color: #d4edda;
  transform: scale(1.1);
  animation: pulseWin 0.6s infinite alternate;
}
@keyframes pulseWin {
  0% { transform: scale(1.05); }
  100% { transform: scale(1.15); }
}
#scratch-canvas {
  position: absolute;
top: 0;
  left: 0;
cursor: pointer;
  touch-action: none;
}
#confetti-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 999;
}
#message {
    margin-top: 20px;
  font-size: 1.3rem;
    font-weight: bold;
min-height: 30px;
    color: #2c3e50;
}
button {
  margin-top: 10px;
    padding: 10px 20px;
font-size: 1rem;
    font-weight: bold;
color: #fff;
    background-color: #3498db;
border: none;
    border-radius: 6px;
cursor: pointer;
    transition: background-color 0.2s;
}
button:hover {
    background-color: #2980b9;
}
    </style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<h1>Scratch Card Game</h1>
<div id="stats-container">
  <div id="win-counter">Wins: 0</div>
  <div id="streak-counter">Streak: 0</div>
</div>
  <div class="card-container">
    <div class="grid" id="symbols-grid">
      <div class="grid-cell"></div>
  <div class="grid-cell"></div>
      <div class="grid-cell"></div>
  <div class="grid-cell"></div>
      <div class="grid-cell"></div>
  <div class="grid-cell"></div>
      <div class="grid-cell"></div>
  <div class="grid-cell"></div>
      <div class="grid-cell"></div>
    </div>
<canvas id="scratch-canvas" width="320" height="320"></canvas>
  </div>
<div id="message">Scratch to reveal your prize!</div>
  <button id="reset-btn">New Ticket</button>
<script>
const canvas = document.getElementById('scratch-canvas');
 const ctx = canvas.getContext('2d');
  const confettiCanvas = document.getElementById('confetti-canvas');
   const confettiCtx = confettiCanvas.getContext('2d');
    const cells = document.querySelectorAll('.grid-cell');
   const messageEl = document.getElementById('message');
    const resetBtn = document.getElementById('reset-btn');
     const winCounterEl = document.getElementById('win-counter');
     const streakCounterEl = document.getElementById('streak-counter');
const SYMBOLS = ['💎', '⭐️', '🍒', '7️⃣', '🍀', '🔔'];
const WIN_PATTERNS = [
  [0, 1, 2], [3, 4, 5], [6, 7, 8],
  [0, 3, 6], [1, 4, 7], [2, 5, 8],
  [0, 4, 8], [2, 4, 6]
];
let isScratching = false;
let isGameOver = false;
let totalWins = 0;
let currentStreak = 0;
let particles = [];
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}
function playScratchSound() {
  initAudio();
  if (!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * 0.04;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1200;
  noise.connect(filter);
  filter.connect(audioCtx.destination);
  noise.start();
}
function playWinSound() {
  initAudio();
  if (!audioCtx) return;
  const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
  notes.forEach((freq, index) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const startTime = audioCtx.currentTime + index * 0.08;
    osc.start(startTime);
    gain.gain.setValueAtTime(0.15, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
    osc.stop(startTime + 0.4);
  });
}
function playLoseSound() {
  initAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
  osc.stop(audioCtx.currentTime + 0.3);
}
function resizeConfetti() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeConfetti);
resizeConfetti();
    function initGame() {
isGameOver = false;
  messageEl.textContent = "Scratch to reveal your prize!";
   particles = [];
   cells.forEach(cell => cell.classList.remove('winning'));
   const symbolsList = generateSymbols();
    cells.forEach((cell, index) => {
cell.textContent = symbolsList[index];
});
ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#b5b5b5';
   ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#888888';
ctx.font = 'bold 20px Arial';
  ctx.textAlign = 'center';
   ctx.fillText('SCRATCH HERE', canvas.width / 2, canvas.height / 2);
}
function getWinningPattern(arr) {
  for (let pattern of WIN_PATTERNS) {
    const [a, b, c] = pattern;
    if (arr[a] && arr[a] === arr[b] && arr[a] === arr[c]) {
      return pattern;
    }
  }
  return null;
}
function generateSymbols() {
    const isWinner = Math.random() < 0.4;
let board = Array(9).fill(null);
  if (isWinner) {
   const pattern = WIN_PATTERNS[Math.floor(Math.random() * WIN_PATTERNS.length)];
    const sym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
     pattern.forEach(idx => board[idx] = sym);
      for (let i = 0; i < 9; i++) {
       if (!board[i]) {
        board[i] = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
       }
      }
  } else {
   do {
    for (let i = 0; i < 9; i++) {
     board[i] = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
    }
   } while (getWinningPattern(board));
}
return board;
}
function getMousePos(e) {
const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
   const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
x: clientX - rect.left,
  y: clientY - rect.top
};
}
function scratch(e) {
    if (!isScratching || isGameOver) return;
const { x, y } = getMousePos(e);
  ctx.globalCompositeOperation = 'destination-out';
   ctx.beginPath();
    ctx.arc(x, y, 25, 0, Math.PI * 2);
ctx.fill();
  playScratchSound();
  checkScratchPercentage();
}
function checkScratchPercentage() {
const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const pixels = imageData.data;
   let clearedPixels = 0;
    for (let i = 3; i < pixels.length; i += 4) {
if (pixels[i] === 0) {
  clearedPixels++;
}
}
const percentage = (clearedPixels / (canvas.width * canvas.height)) * 100;
  if (percentage > 50 && !isGameOver) {
   isGameOver = true;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
     evaluateWin();
}
}
function evaluateWin() {
const symbolsArray = Array.from(cells).map(cell => cell.textContent);
  let winningPattern = getWinningPattern(symbolsArray);
  if (winningPattern) {
   totalWins++;
   currentStreak++;
   winCounterEl.textContent = "Wins: " + totalWins;
   streakCounterEl.textContent = "Streak: " + currentStreak;
   messageEl.textContent = "🎉 JACKPOT! Winning Line Highlighted!";
    messageEl.style.color = "#27ae60";
    
    winningPattern.forEach(idx => {
      cells[idx].classList.add('winning');
    });

    launchEpicConfetti();
    playWinSound();
} else {
  currentStreak = 0;
  streakCounterEl.textContent = "Streak: " + currentStreak;
  messageEl.textContent = "❌ Try Again! No line matched.";
   messageEl.style.color = "#c0392b";
   playLoseSound();
}
}
function launchEpicConfetti() {
  for (let i = 0; i < 200; i++) {
    particles.push({
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      vx: (Math.random() - 0.5) * 22,
      vy: (Math.random() - 0.7) * 22,
      size: Math.random() * 10 + 5,
      color: ['#f1c40f', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#ff007f', '#00ffff'][Math.floor(Math.random() * 7)],
      rotation: Math.random() * 360,
      vRot: (Math.random() - 0.5) * 10,
      alpha: 1
    });
  }
}
function updateConfetti() {
  confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  particles.forEach((p, index) => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.5;
    p.rotation += p.vRot;
    p.alpha -= 0.008;
    if (p.alpha <= 0) {
      particles.splice(index, 1);
      return;
    }
    confettiCtx.save();
    confettiCtx.translate(p.x, p.y);
    confettiCtx.rotate(p.rotation * Math.PI / 180);
    confettiCtx.globalAlpha = p.alpha;
    confettiCtx.fillStyle = p.color;
    confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
    confettiCtx.restore();
  });
  requestAnimationFrame(updateConfetti);
}
updateConfetti();
canvas.addEventListener('mousedown', () => isScratching = true);
 canvas.addEventListener('mouseup', () => isScratching = false);
  canvas.addEventListener('mousemove', scratch);
canvas.addEventListener('touchstart', (e) => {
isScratching = true;
  scratch(e);
});
canvas.addEventListener('touchend', () => isScratching = false);
 canvas.addEventListener('touchmove', scratch);
resetBtn.addEventListener('click', initGame);
initGame();
</script>
</body>
</html>
